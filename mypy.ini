# mypy 配置 —— 静态类型检查
# 用法：python -m mypy core/

[mypy]
# 严格模式开关（逐步开启）
python_version = 3.12

# 严格度设置（渐进式开启）
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True

# 导入检查
ignore_missing_imports = True  # 第三方库暂时跳过

# 宽松一些的警告（pandas-stubs局限性）
no_warn_no_return = True
warn_return_any = False  # pandas的DataFrame操作经常返回Any，暂时不检查

# 忽略pandas-stubs的ExtensionArray局限性错误
disable_error_code = union-attr, operator, type-var, arg-type, call-overload

# 检查的模块
files = core/

# 排除
exclude = (?x)(\.venv/|__pycache__/|experiments/|reports/|docs/|backend_api_python/|mt5/)

# ------------------------------------------------------------------
# 模块级别的宽松配置（逐步收紧）
# ------------------------------------------------------------------

# 数据层：先宽松一点
[mypy.core.data.*]
disallow_untyped_defs = False

# 特征层：已经写得很好了，严格一点
[mypy.core.features.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 风控层：严格
[mypy.core.risk.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 回测层：严格
[mypy.core.backtest.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 审计层：严格
[mypy.core.audit.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 监控层：严格
[mypy.core.monitoring.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 集成层：严格
[mypy.core.integration.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 错误层：严格
[mypy.core.errors]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# 模型层：pandas-stubs局限性较多，宽松一点
[mypy.core.models.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
