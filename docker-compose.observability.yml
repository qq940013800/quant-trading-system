services:
  prometheus:
    image: ${IMAGE_PREFIX:-}prom/prometheus:latest
    container_name: quantdinger-prometheus
    restart: unless-stopped
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--storage.tsdb.retention.time=30d']
    networks: [quantdinger-network]
  grafana:
    image: ${IMAGE_PREFIX:-}grafana/grafana:latest
    container_name: quantdinger-grafana
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus]
    networks: [quantdinger-network]
  alertmanager:
    image: ${IMAGE_PREFIX:-}prom/alertmanager:latest
    container_name: quantdinger-alertmanager
    restart: unless-stopped
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [quantdinger-network]
volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
networks:
  quantdinger-network:

