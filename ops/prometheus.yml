global:
  scrape_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files: ["rules.yml"]
scrape_configs:
  - job_name: "quantdinger-backend"
    static_configs:
      - targets: ["backend:5000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
